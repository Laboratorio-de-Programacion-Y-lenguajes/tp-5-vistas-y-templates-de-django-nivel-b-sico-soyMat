{% extends "base.html" %}

{% block content %}
    <h2>Todas las publicaciones</h2>
    
    <ul>
        {% for pub in publicacion_list %}
            <li>
                <strong>{{ pub.titulo }}</strong> - Autor: {{ pub.autor }} ({{ pub.fecha_publicacion }})
                <a href="{% url 'publicaciones:detalle_publicacion' pub.pk %}">Ver detalle</a>
            </li>
        {% empty %}
            <p>No hay publicaciones disponibles aun.</p>
        {% endfor %}
    </ul>
{% endblock %}
